version: '3.8'

services:
  # The Django Web Service
  web:
    build: .  # This tells Docker Compose to use the Dockerfile in the current directory
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app  # Mounts your local code into the container for live reloading
    ports:
      - "8000:8000" # Maps your local port 8000 to the container's port 8000
    depends_on:
      - db
      - ollama
    environment:
      - DJANGO_SECRET_KEY=your-local-secret-key
      - DJANGO_DEBUG=True
      - DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1
      - DATABASE_URL=postgres://sakr_user:sakr_password@db:5432/sakr_db

  # The Ollama Service
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  # The Database Service
  db:
    image: postgres:14-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=sakr_db
      - POSTGRES_USER=sakr_user
      - POSTGRES_PASSWORD=sakr_password

volumes:
  postgres_data:
  ollama_data:
